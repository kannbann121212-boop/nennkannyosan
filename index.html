<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家計ツール</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect x='8' y='8' width='112' height='112' rx='25' fill='%232c3e50'/%3E%3Crect x='32' y='76' width='16' height='24' rx='4' fill='%238ba888'/%3E%3Crect x='56' y='60' width='16' height='40' rx='4' fill='%238ba888'/%3E%3Crect x='80' y='44' width='16' height='56' rx='4' fill='%238ba888'/%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="家計ツール">
<meta name="theme-color" content="#2c3e50">
<style>
  :root {
    --navy: #2c3e50;
    --navy-light: #46617a;
    --sage: #8ba888;
    --sage-light: #eaf0e8;
    --coral: #d9764a;
    --coral-light: #fbe9e0;
    --gold: #c9a227;
    --gold-light: #f7edc9;
    --cream: #f5f1e8;
    --cream-dark: #ece5d5;
    --ink: #2c2a26;
    --line: #ddd4c0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }
  header {
    padding: 8px 2px 20px;
    border-bottom: 2px solid var(--navy);
    margin-bottom: 20px;
  }
  header h1 {
    font-size: 21px;
    margin: 0;
    color: var(--navy);
    letter-spacing: 0.02em;
  }
  .tool-link {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    text-decoration: none;
    color: var(--ink);
  }
  .tool-link:active { background: var(--cream-dark); }
  .tool-icon {
    flex: none;
    width: 48px;
    height: 48px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tool-icon.budget { background: var(--navy); }
  .tool-icon.balance { background: var(--gold); }
  .tool-icon svg { width: 26px; height: 26px; }
  .tool-text { flex: 1; min-width: 0; }
  .tool-text .title { font-size: 15px; font-weight: 700; color: var(--navy); margin-bottom: 2px; }
  .tool-text .desc { font-size: 12px; color: #8a8272; }
  .arrow { flex: none; color: #b7ab90; font-size: 18px; }
  footer {
    text-align: center;
    font-size: 11px;
    color: #a89f8a;
    margin-top: 24px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>家計ツール</h1></header>

  <a class="tool-link" href="annual-budget-planner.html">
    <div class="tool-icon budget">
      <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="12" width="4" height="9" rx="1" fill="#8ba888"/><rect x="10" y="7" width="4" height="14" rx="1" fill="#8ba888"/><rect x="17" y="3" width="4" height="18" rx="1" fill="#8ba888"/></svg>
    </div>
    <div class="tool-text">
      <div class="title">年間予算計画表</div>
      <div class="desc">収入・支出・貯蓄と投資に回せる額を計算</div>
    </div>
    <div class="arrow">›</div>
  </a>

  <a class="tool-link" href="hiwari-kakeibo.html">
    <div class="tool-icon balance">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#2c3e50" stroke-width="2"/><path d="M12 7v5l3 3" stroke="#2c3e50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="tool-text">
      <div class="title">残高チェック</div>
      <div class="desc">給料日を基準に残高がマイナスにならないか確認</div>
    </div>
    <div class="arrow">›</div>
  </a>

  <footer>家計ツール ・ すべてのデータはこの端末内に保存されます</footer>
</div>
</body>
</html>
