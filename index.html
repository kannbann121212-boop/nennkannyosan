<style>
  :root {
    --navy: #2c3e50;
    --navy-light: #46617a;
    --sage: #8ba888;
    --sage-light: #eaf0e8;
    --coral: #d9764a;
    --coral-light: #fbe9e0;
    --gold: #c9a227;
    --gold-light: #f7edc9;
    --cream: #f5f1e8;
    --cream-dark: #ece5d5;
    --ink: #2c2a26;
    --line: #ddd4c0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }
  header {
    padding: 8px 2px 20px;
    border-bottom: 2px solid var(--navy);
    margin-bottom: 20px;
  }
  header h1 {
    font-size: 21px;
    margin: 0;
    color: var(--navy);
    letter-spacing: 0.02em;
  }
  .tool-link {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    text-decoration: none;
    color: var(--ink);
  }
  .tool-link:active { background: var(--cream-dark); }
  .tool-icon {
    flex: none;
    width: 48px;
    height: 48px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tool-icon.budget { background: var(--navy); }
  .tool-icon.balance { background: var(--gold); }
  .tool-icon.savings { background: var(--coral); }
  .tool-icon.family { background: var(--sage); }
  .tool-icon.assets { background: var(--navy-light); }
  .tool-icon.review { background: var(--gold); }
  .tool-icon svg { width: 26px; height: 26px; }
  .tool-text { flex: 1; min-width: 0; }
  .tool-text .title { font-size: 15px; font-weight: 700; color: var(--navy); margin-bottom: 2px; }
  .tool-text .desc { font-size: 12px; color: #8a8272; }
  .arrow { flex: none; color: #b7ab90; font-size: 18px; }
  footer {
    text-align: center;
    font-size: 11px;
    color: #a89f8a;
    margin-top: 24px;
  }
</style>
</head>
